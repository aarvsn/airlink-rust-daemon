[package]
name = "airlinkd"
version = "2.0.0-rc1"
edition = "2021"

[lib]
name = "airlinkd"
path = "src_rust/lib.rs"

[[bin]]
name = "airlinkd"
path = "src_rust/main.rs"

[[bin]]
name = "configure"
path = "src_rust/bin/configure.rs"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full", "limit"] }
bollard = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
sysinfo = "0.33"
sha2 = "0.10"
hmac = "0.12"
subtle = "2.6"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1.11", features = ["v4"] }
tar = "0.4"
flate2 = "1.0"
zip = "2.2"
walkdir = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.9"
futures-util = "0.3"
async-trait = "0.1"
regex = "1.11"
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
rand = "0.8"

[dev-dependencies]
tempfile = "3.15"
